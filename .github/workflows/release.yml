name: Publish Release

# Publishes a GitHub Release for one plugin: re-validates it, zips it, and
# attaches the zip — giving a stable HTTPS download URL usable with
# `claude --plugin-url <release-asset-url>`.
#
# Three ways to trigger:
#   1. workflow_call — invoked directly by tag.yml right after it creates a
#      tag, in the same run. This is the primary path: a tag pushed with the
#      default GITHUB_TOKEN does NOT trigger other workflows (GitHub's
#      loop-prevention), so tag.yml calls this one explicitly instead of
#      relying on the tag-push trigger below to fire it.
#   2. push: tags — fallback for a tag pushed manually (e.g. a human with
#      their own PAT/SSH key running `claude plugin tag --push` locally).
#   3. workflow_dispatch — manual recovery: re-run the release for a tag
#      that already exists but whose release never got created (e.g. this
#      job failed after tagging succeeded). `gh workflow run release.yml
#      -f plugin_name=... -f version=... -f tag=...`

on:
  push:
    tags:
      - "*--v*"
  workflow_dispatch:
    inputs:
      plugin_name:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve plugin name/version/tag
        id: resolve
        run: |
          # github.event_name here reflects the *caller's* trigger (e.g.
          # workflow_run from tag.yml), not "workflow_call" — so detect a
          # reusable-workflow invocation by whether inputs.tag was actually
          # passed, not by event_name.
          if [ -n "${{ inputs.tag }}" ]; then
            name="${{ inputs.plugin_name }}"
            version="${{ inputs.version }}"
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            name="${tag%--v*}"
            version="${tag##*--v}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the tagged plugin
        if: steps.check.outputs.exists == 'false'
        run: claude plugin validate --strict "plugins/${{ steps.resolve.outputs.name }}"

      - name: Zip the plugin
        if: steps.check.outputs.exists == 'false'
        run: |
          cd plugins
          zip -r "../${{ steps.resolve.outputs.name }}-${{ steps.resolve.outputs.version }}.zip" "${{ steps.resolve.outputs.name }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.resolve.outputs.tag }}" \
            "${{ steps.resolve.outputs.name }}-${{ steps.resolve.outputs.version }}.zip" \
            --title "${{ steps.resolve.outputs.name }} v${{ steps.resolve.outputs.version }}" \
            --generate-notes
