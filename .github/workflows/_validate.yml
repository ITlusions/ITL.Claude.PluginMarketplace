name: _validate

# Reusable template: validates one plugin or marketplace manifest at a given
# path. Called via matrix from ci.yml — once for the marketplace root, once
# per discovered plugin — so adding a new plugin needs zero changes here.

on:
  workflow_call:
    inputs:
      path:
        description: Path to a plugin directory, or "." for the marketplace root
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate
        run: claude plugin validate --strict "${{ inputs.path }}"
