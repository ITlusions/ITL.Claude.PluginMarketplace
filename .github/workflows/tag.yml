name: Auto-Tag Plugin Releases

# Runs after Validate succeeds on master. Owns versioning end to end — you
# never hand-edit "version" in a plugin.json. For each plugin:
#
#   1. Find its latest tag ({plugin}--v{version}).
#   2. If no files under plugins/<name>/ changed since that tag, skip it.
#   3. Otherwise compute the next semver from conventional-commit-style
#      messages touching that plugin's directory since the last tag:
#        - "BREAKING CHANGE" in the body, or a "!" before the colon (feat!:)
#          -> major bump
#        - "feat:" / "feat(scope):"                -> minor bump
#        - anything else (fix:, chore:, docs:, ...)  -> patch bump
#      A plugin with no tag yet keeps whatever version is currently in its
#      plugin.json (that's its v1 baseline; the pipeline owns every bump
#      after that).
#   4. Write the new version into plugin.json, commit it to master.
#   5. `claude plugin tag` creates + pushes the {plugin}--v{version} tag
#      (it also validates plugin.json and the marketplace entry agree).
#   6. Invoke release.yml (as a reusable workflow) directly in this same
#      run for every plugin just tagged — a tag pushed with the default
#      GITHUB_TOKEN does not trigger other workflows via its own push
#      event (GitHub's loop-prevention), so we call it explicitly instead
#      of relying on that.

on:
  workflow_run:
    workflows: ["Validate"]
    branches: [master]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Re-validate (defense in depth)
        run: claude plugin validate --strict .

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute versions, bump plugin.json, tag
        id: tag
        run: |
          set -euo pipefail
          shopt -s nullglob
          tagged="[]"

          for dir in plugins/*/; do
            name=$(basename "$dir")
            manifest="${dir}.claude-plugin/plugin.json"
            if [ ! -f "$manifest" ]; then
              echo "Skipping $name: no plugin.json"
              continue
            fi

            latest_tag=$(git tag -l "${name}--v*" | sort -V | tail -n1 || true)

            if [ -z "$latest_tag" ]; then
              # First release for this plugin: honor whatever version is
              # currently committed as its v1 baseline.
              new_version=$(node -p "require('./$manifest').version")
              echo "$name: no prior tag, baselining at $new_version"
            else
              if git diff --quiet "$latest_tag" -- "$dir"; then
                echo "$name: no changes since $latest_tag, skipping"
                continue
              fi

              latest_version="${latest_tag##*--v}"
              bump=patch
              while IFS= read -r msg; do
                case "$msg" in
                  *BREAKING\ CHANGE*) bump=major ;;
                  *!:*) [ "$bump" = major ] || bump=major ;;
                  feat:*|feat\(*) [ "$bump" = major ] || bump=minor ;;
                esac
              done < <(git log "${latest_tag}..HEAD" --pretty=%s -- "$dir")

              IFS=. read -r major minor patch <<< "$latest_version"
              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              new_version="${major}.${minor}.${patch}"
              echo "$name: $latest_version -> $new_version (bump: $bump)"
            fi

            node -e "
              const fs = require('fs');
              const p = '$manifest';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.version = '$new_version';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
            git add "$manifest"
            git commit -m "chore($name): bump version to $new_version [skip ci]"

            tag="${name}--v${new_version}"
            claude plugin tag "$dir" --push -m "Release %s"
            git push origin master

            tagged=$(node -p "JSON.stringify([...$tagged, {name: '$name', version: '$new_version', tag: '$tag'}])")
          done

          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tagged != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.tag.outputs.tagged) }}
    uses: ./.github/workflows/release.yml
    with:
      plugin_name: ${{ matrix.plugin.name }}
      version: ${{ matrix.plugin.version }}
      tag: ${{ matrix.plugin.tag }}
    permissions:
      contents: write
