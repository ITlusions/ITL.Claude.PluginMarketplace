name: Auto-Tag Plugin Releases

# Runs after Validate succeeds on master. For each plugin, compares the
# version in plugin.json against existing git tags (named {plugin}--v{version},
# the convention enforced by `claude plugin tag`). If a plugin's version was
# bumped and has no matching tag yet, creates and pushes one, then directly
# invokes release.yml (as a reusable workflow) for it in this same run —
# a tag pushed with the default GITHUB_TOKEN does not trigger other
# workflows via push, so we call it explicitly rather than relying on that.

on:
  workflow_run:
    workflows: ["Validate"]
    branches: [master]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Re-validate (defense in depth)
        run: claude plugin validate --strict .

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag plugins whose version changed
        id: tag
        run: |
          set -euo pipefail
          shopt -s nullglob
          tagged="[]"
          for dir in plugins/*/; do
            name=$(basename "$dir")
            manifest="$dir/.claude-plugin/plugin.json"
            if [ ! -f "$manifest" ]; then
              echo "Skipping $name: no plugin.json"
              continue
            fi

            version=$(node -p "require('./$manifest').version")
            tag="${name}--v${version}"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$name: $tag already exists, nothing to do"
              continue
            fi

            echo "$name: creating new tag $tag"
            claude plugin tag "$dir" --push -m "Release %s"
            tagged=$(node -p "JSON.stringify([...$tagged, {name: '$name', version: '$version', tag: '$tag'}])")
          done
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tagged != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.tag.outputs.tagged) }}
    uses: ./.github/workflows/release.yml
    with:
      plugin_name: ${{ matrix.plugin.name }}
      version: ${{ matrix.plugin.version }}
      tag: ${{ matrix.plugin.tag }}
    permissions:
      contents: write
