{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "itl-poc-agent.name" . }}
  labels: {{- include "itl-poc-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "itl-poc-agent.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if eq .Values.mode "headless" }}
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.headless.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.headless.port }}}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.networkPolicy.blockedCidrs | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
